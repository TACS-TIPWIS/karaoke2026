<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Songs Hub</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f1020;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .app-layout {
            display: grid;
            grid-template-columns: 1fr 1fr 350px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (max-width: 1100px) {
            .app-layout { grid-template-columns: 1fr; }
        }
        .card {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        h2, h3 { margin-top: 0; color: #e94560; }
        input, button, select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #12121e;
            color: white;
            box-sizing: border-box;
        }
        button {
            background: #e94560;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #ff6b81; }
        .song-item, .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #16213e;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        #tv-monitor {
            width: 100%;
            height: 280px;
            background: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }
        #tv-monitor video, #tv-monitor audio {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        /* Login Overlay */
        #login-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- SECURE LOGIN MODAL -->
    <div id="login-modal">
        <div class="login-box">
            <h2>Karaoke Hub Login</h2>
            <p style="font-size:12px; color:#aaa; margin-bottom:20px;">Enter your credentials to access</p>
            <input type="text" id="login-username" placeholder="Username">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="handleLogin()">Login</button>
            <p id="login-error" style="color:#ff6b6b; font-size:12px; margin-top:10px;"></p>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div style="max-width: 1400px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin:0;">🎤 Karaoke Songs Hub Pro</h2>
            <button onclick="handleLogout()" style="width: auto; padding: 6px 12px; background: #333; font-size: 12px;">Logout</button>
        </div>

        <div class="app-layout">
            <!-- COLUMN 1: Library & Search -->
            <div>
                <div class="card">
                    <h3>Library</h3>
                    <input type="text" id="search-input" placeholder="Search library..." oninput="filterSongs()">
                    <div id="song-list" style="margin-top: 15px; max-height: 400px; overflow-y: auto;">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <!-- Admin Upload Section (Hidden for normal users) -->
                <div id="add-song-section" class="card" style="display: none;">
                    <h3>Add New Song</h3>
                    <input type="text" id="song-title" placeholder="Song Title">
                    <input type="text" id="song-artist" placeholder="Artist">
                    <input type="text" id="song-url" placeholder="Media URL (Audio/Video file link)">
                    <button onclick="uploadSong()">Upload & Sync</button>
                </div>
            </div>

            <!-- COLUMN 2: TV Monitor & Controls -->
            <div>
                <div class="card">
                    <h3>📺 TV Monitor</h3>
                    <div id="tv-monitor">
                        <span id="monitor-placeholder">No song playing</span>
                    </div>
                    <div id="now-playing-info" style="text-align: center; margin-bottom: 15px;">
                        <strong id="current-title">-</strong><br>
                        <small id="current-artist" style="color:#aaa;">-</small>
                    </div>
                    
                    <!-- Playback Controls -->
                    <div class="controls-grid">
                        <button onclick="playMedia()" style="background: #16213e; margin:0;">▶ Play</button>
                        <button onclick="pauseMedia()" style="background: #16213e; margin:0;">⏸ Pause</button>
                        <button onclick="stopMedia()" style="background: #d9534f; margin:0;">⏹ Stop</button>
                        <button onclick="playPreviousInQueue()" style="background: #0f3460; margin:0;">⏮ Prev</button>
                        <button onclick="playNextInQueue()" style="background: #0f3460; margin:0;">⏭ Next</button>
                        <button onclick="toggleFullscreen()" style="background: #e94560; margin:0;">🖵 Full</button>
                    </div>
                </div>

                <!-- Admin User Management Panel (Visible only to admin 'ronel') -->
                <div id="admin-user-section" class="card" style="display: none;">
                    <h3>👥 Manage Allowed Users</h3>
                    <input type="text" id="new-username" placeholder="New User Username">
                    <input type="password" id="new-password" placeholder="New User Password">
                    <button onclick="createNewUser()" style="background: #0f3460;">Generate User Account</button>
                    <div id="user-list" style="margin-top: 15px; font-size: 13px; max-height: 150px; overflow-y: auto;"></div>
                </div>
            </div>

            <!-- COLUMN 3: Synchronized Queue (Right Corner) -->
            <div>
                <div class="card" style="height: 100%;">
                    <h3>🎵 Song Queue</h3>
                    <div id="queue-list" style="margin-top: 15px; max-height: 500px; overflow-y: auto;">
                        <p style="color:#aaa; font-size:13px; text-align:center;">Queue is empty</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // SUPABASE CONFIGURATION
        const SUPABASE_URL = 'https://wnoezoiyjnvftvpbosva.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Ftro51fz2tJtgFbQzhq4uw_Txmc_kGi';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let allSongs = [];
        let songQueue = [];
        let currentQueueIndex = 0;

        // --- AUTHENTICATION LOGIC ---
        async function handleLogin() {
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            const err = document.getElementById('login-error');

            if (!u || !p) {
                err.innerText = "Please enter both username and password.";
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', u)
                    .eq('password', p)
                    .single();

                if (error || !data) {
                    err.innerText = "Invalid username or password.";
                    return;
                }

                currentUser = data;
                localStorage.setItem('karaoke_user', JSON.stringify(data));
                applyUserPermissions();
                document.getElementById('login-modal').style.display = 'none';
                loadSongs();
            } catch (ex) {
                err.innerText = "Login failed. Check connection.";
            }
        }

        function handleLogout() {
            localStorage.removeItem('karaoke_user');
            currentUser = null;
            document.getElementById('login-modal').style.display = 'flex';
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
        }

        function applyUserPermissions() {
            const uploadSection = document.getElementById('add-song-section');
            const adminSection = document.getElementById('admin-user-section');

            if (currentUser && currentUser.role === 'admin') {
                if (uploadSection) uploadSection.style.display = 'block';
                if (adminSection) adminSection.style.display = 'block';
                loadUserList();
            } else {
                if (uploadSection) uploadSection.style.display = 'none';
                if (adminSection) adminSection.style.display = 'none';
            }
        }

        // --- ADMIN USER MANAGEMENT ---
        async function createNewUser() {
            const username = document.getElementById('new-username').value.trim();
            const password = document.getElementById('new-password').value.trim();

            if (!username || !password) {
                alert("Provide both username and password.");
                return;
            }

            const { error } = await supabaseClient
                .from('users')
                .insert([{ username, password, role: 'user' }]);

            if (error) {
                alert("Error creating user: " + error.message);
            } else {
                alert(`User '${username}' created successfully!`);
                document.getElementById('new-username').value = '';
                document.getElementById('new-password').value = '';
                loadUserList();
            }
        }

        async function loadUserList() {
            const listDiv = document.getElementById('user-list');
            if (!listDiv) return;

            const { data } = await supabaseClient.from('users').select('username, role, created_at');
            if (data) {
                listDiv.innerHTML = '<b>Authorized Users:</b><br>' + data.map(usr => `- ${usr.username} (${usr.role})`).join('<br>');
            }
        }

        // --- SONG LIBRARY & QUEUE MANAGEMENT ---
        async function loadSongs() {
            const { data, error } = await supabaseClient.from('songs').select('*');
            if (!error && data) {
                allSongs = data;
                renderSongs(allSongs);
            }
        }

        function renderSongs(songs) {
            const listDiv = document.getElementById('song-list');
            listDiv.innerHTML = '';
            
            if (songs.length === 0) {
                listDiv.innerHTML = '<p style="color:#aaa; font-size:13px; text-align:center;">No songs found.</p>';
                return;
            }

            songs.forEach(song => {
                const item = document.createElement('div');
                item.className = 'song-item';
                
                let deleteBtn = '';
                if (currentUser && currentUser.role === 'admin') {
                    deleteBtn = `<button onclick="deleteSong('${song.id}')" style="width:auto; padding:5px 8px; background:#d9534f; margin:0;">Del</button>`;
                }

                item.innerHTML = `
                    <div style="cursor:pointer; flex-grow:1;" onclick="addToQueue('${song.id}')">
                        <strong>${song.title}</strong><br>
                        <small style="color:#aaa;">${song.artist || 'Unknown'}</small>
                    </div>
                    <div style="display:flex; gap:5px;">
                        <button onclick="addToQueue('${song.id}')" style="width:auto; padding:5px 10px; margin:0; background:#0f3460;">Add</button>
                        ${deleteBtn}
                    </div>
                `;
                listDiv.appendChild(item);
            });
        }

        function filterSongs() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allSongs.filter(s => 
                s.title.toLowerCase().includes(query) || (s.artist && s.artist.toLowerCase().includes(query))
            );
            renderSongs(filtered);
        }

        function addToQueue(songId) {
            const song = allSongs.find(s => s.id == songId);
            if (song) {
                songQueue.push(song);
                renderQueue();
                if (songQueue.length === 1) {
                    currentQueueIndex = 0;
                    playSong(songQueue[0]);
                }
            }
        }

        function renderQueue() {
            const queueDiv = document.getElementById('queue-list');
            if (songQueue.length === 0) {
                queueDiv.innerHTML = '<p style="color:#aaa; font-size:13px; text-align:center;">Queue is empty</p>';
                return;
            }

            queueDiv.innerHTML = '';
            songQueue.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = 'queue-item';
                let isCurrent = (index === currentQueueIndex) ? 'border: 1px solid #e94560;' : '';
                item.style.cssText = isCurrent;
                item.innerHTML = `
                    <div>
                        <small style="color:#e94560;">#${index + 1}</small><strong>${song.title}</strong><br>
                        <small style="color:#aaa;">${song.artist || 'Unknown'}</small>
                    </div>
                    <button onclick="removeFromQueue(${index})" style="width:auto; padding:4px 8px; background:#333; margin:0;">✕</button>
                `;
                queueDiv.appendChild(item);
            });
        }

        function removeFromQueue(index) {
            songQueue.splice(index, 1);
            if (index === currentQueueIndex && songQueue.length > 0) {
                currentQueueIndex = Math.min(index, songQueue.length - 1);
                playSong(songQueue[currentQueueIndex]);
            } else if (songQueue.length === 0) {
                stopMedia();
            }
            renderQueue();
        }

        function playSong(song) {
            const monitor = document.getElementById('tv-monitor');
            document.getElementById('current-title').innerText = song.title;
            document.getElementById('current-artist').innerText = song.artist || 'Unknown';

            if (song.url) {
                monitor.innerHTML = `<video id="active-media" src="${song.url}" controls autoplay style="width:100%; height:100%;"></video>`;
            } else {
                monitor.innerHTML = `<div style="color:#aaa; text-align:center;">Playing simulation for: <strong>${song.title}</strong></div>`;
            }
            renderQueue();
        }

        // --- PLAYBACK CONTROLS ---
        function playMedia() {
            const media = document.getElementById('active-media');
            if (media) media.play();
        }

        function pauseMedia() {
            const media = document.getElementById('active-media');
            if (media) media.pause();
        }

        function stopMedia() {
            const monitor = document.getElementById('tv-monitor');
            monitor.innerHTML = '<span id="monitor-placeholder">No song playing</span>';
            document.getElementById('current-title').innerText = '-';
            document.getElementById('current-artist').innerText = '-';
            songQueue = [];
            currentQueueIndex = 0;
            renderQueue();
        }

        function playNextInQueue() {
            if (songQueue.length > 0 && currentQueueIndex < songQueue.length - 1) {
                currentQueueIndex++;
                playSong(songQueue[currentQueueIndex]);
            } else {
                stopMedia();
            }
        }

        function playPreviousInQueue() {
            if (songQueue.length > 0 && currentQueueIndex > 0) {
                currentQueueIndex--;
                playSong(songQueue[currentQueueIndex]);
            }
        }

        function toggleFullscreen() {
            const monitor = document.getElementById('tv-monitor');
            if (!document.fullscreenElement) {
                if (monitor.requestFullscreen) {
                    monitor.requestFullscreen();
                } else if (monitor.webkitRequestFullscreen) {
                    monitor.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        async function uploadSong() {
            if (!currentUser || currentUser.role !== 'admin') {
                alert("Unauthorized");
                return;
            }
            const title = document.getElementById('song-title').value.trim();
            const artist = document.getElementById('song-artist').value.trim();
            const url = document.getElementById('song-url').value.trim();

            if (!title) {
                alert("Please provide a song title.");
                return;
            }

            const { error } = await supabaseClient.from('songs').insert([{ title, artist, url }]);
            if (error) {
                alert("Error adding song: " + error.message);
            } else {
                alert("Song added successfully!");
                document.getElementById('song-title').value = '';
                document.getElementById('song-artist').value = '';
                document.getElementById('song-url').value = '';
                loadSongs();
            }
        }

        async function deleteSong(id) {
            if (!currentUser || currentUser.role !== 'admin') return;
            if (confirm("Are you sure you want to delete this song?")) {
                await supabaseClient.from('songs').delete().eq('id', id);
                loadSongs();
            }
        }

        // Auto-login check on page load
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('karaoke_user');
            if (saved) {
                currentUser = JSON.parse(saved);
                applyUserPermissions();
                document.getElementById('login-modal').style.display = 'none';
                loadSongs();
            }
        });
    </script>
</body>
</html>
