<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Songs Hub</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f1020;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .card {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        h2, h3 { margin-top: 0; color: #e94560; }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #12121e;
            color: white;
            box-sizing: border-box;
        }
        button {
            background: #e94560;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #ff6b81; }
        .song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #16213e;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        /* Login Overlay */
        #login-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- SECURE LOGIN MODAL -->
    <div id="login-modal">
        <div class="login-box">
            <h2>Karaoke Hub Login</h2>
            <p style="font-size:12px; color:#aaa; margin-bottom:20px;">Enter your credentials to access</p>
            <input type="text" id="login-username" placeholder="Username">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="handleLogin()">Login</button>
            <p id="login-error" style="color:#ff6b6b; font-size:12px; margin-top:10px;"></p>
        </div>
    </div>

    <div class="container">
        <!-- Header Info -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="margin:0;">🎤 Karaoke Songs Hub</h2>
            <button onclick="handleLogout()" style="width: auto; padding: 6px 12px; background: #333; font-size: 12px;">Logout</button>
        </div>

        <!-- Song Library Card -->
        <div class="card">
            <h3>Library</h3>
            <input type="text" id="search-input" placeholder="Search library..." oninput="filterSongs()">
            <div id="song-list" style="margin-top: 15px; max-height: 250px; overflow-y: auto;">
                <!-- Populated dynamically -->
            </div>
        </div>

        <!-- Admin Upload Section (Hidden for normal users) -->
        <div id="add-song-section" class="card" style="display: none;">
            <h3>Add New Song</h3>
            <input type="text" id="song-title" placeholder="Song Title">
            <input type="text" id="song-artist" placeholder="Artist">
            <input type="file" id="song-file" accept="audio/*,video/*" style="background:none; border:none; padding:0;">
            <button onclick="uploadSong()">Upload & Sync</button>
        </div>

        <!-- Admin User Management Panel (Visible only to admin 'ronel') -->
        <div id="admin-user-section" class="card" style="display: none;">
            <h3>👥 Manage Allowed Users</h3>
            <input type="text" id="new-username" placeholder="New User Username">
            <input type="password" id="new-password" placeholder="New User Password">
            <button onclick="createNewUser()" style="background: #0f3460;">Generate User Account</button>
            <div id="user-list" style="margin-top: 15px; font-size: 13px; max-height: 150px; overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR ACTUAL SUPABASE CREDENTIALS
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let allSongs = [];

        // --- AUTHENTICATION LOGIC ---
        async function handleLogin() {
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            const err = document.getElementById('login-error');

            if (!u || !p) {
                err.innerText = "Please enter both username and password.";
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', u)
                    .eq('password', p)
                    .single();

                if (error || !data) {
                    err.innerText = "Invalid username or password.";
                    return;
                }

                currentUser = data;
                localStorage.setItem('karaoke_user', JSON.stringify(data));
                applyUserPermissions();
                document.getElementById('login-modal').style.display = 'none';
                loadSongs();
            } catch (ex) {
                err.innerText = "Login failed. Check connection.";
            }
        }

        function handleLogout() {
            localStorage.removeItem('karaoke_user');
            currentUser = null;
            document.getElementById('login-modal').style.display = 'flex';
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
        }

        function applyUserPermissions() {
            const uploadSection = document.getElementById('add-song-section');
            const adminSection = document.getElementById('admin-user-section');

            if (currentUser && currentUser.role === 'admin') {
                if (uploadSection) uploadSection.style.display = 'block';
                if (adminSection) adminSection.style.display = 'block';
                loadUserList();
            } else {
                if (uploadSection) uploadSection.style.display = 'none';
                if (adminSection) adminSection.style.display = 'none';
            }
        }

        // --- ADMIN USER MANAGEMENT ---
        async function createNewUser() {
            const username = document.getElementById('new-username').value.trim();
            const password = document.getElementById('new-password').value.trim();

            if (!username || !password) {
                alert("Provide both username and password.");
                return;
            }

            const { error } = await supabaseClient
                .from('users')
                .insert([{ username, password, role: 'user' }]);

            if (error) {
                alert("Error creating user: " + error.message);
            } else {
                alert(`User '${username}' created successfully!`);
                document.getElementById('new-username').value = '';
                document.getElementById('new-password').value = '';
                loadUserList();
            }
        }

        async function loadUserList() {
            const listDiv = document.getElementById('user-list');
            if (!listDiv) return;

            const { data } = await supabaseClient.from('users').select('username, role, created_at');
            if (data) {
                listDiv.innerHTML = '<b>Authorized Users:</b><br>' + data.map(usr => `- ${usr.username} (${usr.role})`).join('<br>');
            }
        }

        // --- SONG LIBRARY MANAGEMENT ---
        async function loadSongs() {
            const { data, error } = await supabaseClient.from('songs').select('*');
            if (!error && data) {
                allSongs = data;
                renderSongs(allSongs);
            }
        }

        function renderSongs(songs) {
            const listDiv = document.getElementById('song-list');
            listDiv.innerHTML = '';
            
            if (songs.length === 0) {
                listDiv.innerHTML = '<p style="color:#aaa; font-size:13px; text-align:center;">No songs found.</p>';
                return;
            }

            songs.forEach(song => {
                const item = document.createElement('div');
                item.className = 'song-item';
                
                let deleteBtn = '';
                // Only allow admins to delete songs
                if (currentUser && currentUser.role === 'admin') {
                    deleteBtn = `<button onclick="deleteSong('${song.id}')" style="width:auto; padding:5px 10px; background:#d9534f; margin:0;">Delete</button>`;
                }

                item.innerHTML = `
                    <div>
                        <strong>${song.title}</strong><br>
                        <small style="color:#aaa;">${song.artist || 'Unknown'}</small>
                    </div>
                    ${deleteBtn}
                `;
                listDiv.appendChild(item);
            });
        }

        function filterSongs() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allSongs.filter(s => 
                s.title.toLowerCase().includes(query) || (s.artist && s.artist.toLowerCase().includes(query))
            );
            renderSongs(filtered);
        }

        async function uploadSong() {
            if (!currentUser || currentUser.role !== 'admin') {
                alert("Unauthorized");
                return;
            }
            const title = document.getElementById('song-title').value.trim();
            const artist = document.getElementById('song-artist').value.trim();
            const fileInput = document.getElementById('song-file');

            if (!title || fileInput.files.length === 0) {
                alert("Please provide a song title and select a file.");
                return;
            }

            // Upload handling logic goes here...
            alert("Upload triggered for " + title);
        }

        async function deleteSong(id) {
            if (!currentUser || currentUser.role !== 'admin') return;
            if (confirm("Are you sure you want to delete this song?")) {
                await supabaseClient.from('songs').delete().eq('id', id);
                loadSongs();
            }
        }

        // Auto-login check on page load
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('karaoke_user');
            if (saved) {
                currentUser = JSON.parse(saved);
                applyUserPermissions();
                document.getElementById('login-modal').style.display = 'none';
                loadSongs();
            }
        });
    </script>
</body>
</html>
